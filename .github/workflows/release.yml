# Cuts a release with no hand-edited version numbers anywhere.
#
# The only thing a person writes is the changelog prose, accumulated under
# [Unreleased] during normal work. This workflow decides the number, stamps the date,
# updates package.json, commits both, tags that commit, builds the package, and
# publishes. Nothing is typed twice, so nothing can disagree.
#
# Order matters, and it is why this replaced the old release-triggered workflow.
# The version files are committed FIRST and the tag is created on that commit.
# Reacting to a published release could never do that -- by then the tag was frozen
# and the asset uploaded, so v1.1.1 shipped a package.json that still said 1.1.0.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase.
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]
      version:
        description: Exact version, e.g. 2.2.0. Overrides the bump choice.
        required: false
        type: string
      highlights:
        description: >
          Markdown bullets for a Highlights section. Leave empty to publish the whole
          changelog section instead.
        required: false
        type: string
      dry_run:
        description: Build and validate without committing, tagging, or publishing.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Its own step because both the version commit and the annotated tag need an
      # identity. Configuring it inside the commit step left tagging to fail with
      # "empty ident name" whenever that step had nothing to commit.
      - name: Configure the committer identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Refuses when [Unreleased] is empty, so a release always carries notes.
      - name: Promote the Unreleased section
        id: promote
        shell: pwsh
        run: |
          ./.github/scripts/Promote-ChangelogUnreleased.ps1 `
            -Bump "${{ inputs.bump }}" `
            -Version "${{ inputs.version }}" `
            -EmitGitHubOutput

      - name: Refuse to reuse an existing tag
        shell: bash
        run: |
          TAG="v${{ steps.promote.outputs.version }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Sync package.json to the release version
        shell: pwsh
        run: ./.github/scripts/Sync-PackageVersionFromTag.ps1 -Tag $env:TAG

      - name: Read the release notes back
        id: changelog
        shell: pwsh
        run: |
          ./.github/scripts/Get-ChangelogRelease.ps1 `
            -Version "${{ steps.promote.outputs.version }}" `
            -EmitGitHubOutput

      - name: Commit the version files
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          git add CHANGELOG.md CrowFX/package.json

          if git diff --cached --quiet; then
            echo "::error::Nothing to commit. The changelog and package.json were already at $TAG."
            exit 1
          fi

          git commit -m "Release CrowFX ${{ steps.promote.outputs.version }}"

      - name: Build the unitypackage
        id: package
        shell: pwsh
        run: |
          ./.github/scripts/New-UnityPackage.ps1 `
            -Version "${{ steps.promote.outputs.version }}" `
            -OutputDirectory "dist"

      - name: Report what a dry run would have published
        if: ${{ inputs.dry_run }}
        env:
          # Markdown reaches the script through the environment, never through
          # expression interpolation: it contains backticks, which bash would run as
          # command substitution inside double quotes.
          HIGHLIGHTS: ${{ inputs.highlights }}
          CHANGELOG_NOTES: ${{ steps.changelog.outputs.notes }}
        shell: bash
        run: |
          {
            echo "## Dry run: $TAG"
            echo ""
            echo "Nothing was committed, tagged, or published."
            echo ""
            echo "Package: ${{ steps.package.outputs.package-name }}"
            echo ""
            echo "### Release notes that would be used"
            echo ""

            if [ -n "$HIGHLIGHTS" ]; then
              echo "## Highlights"
              echo ""
              printf '%s\n' "$HIGHLIGHTS"
            else
              printf '%s\n' "$CHANGELOG_NOTES"
            fi

            echo ""
            echo "### Changelog diff that would be committed"
            echo ""
            echo '```diff'
            git --no-pager diff -- CHANGELOG.md CrowFX/package.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry-run package for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.package-name }}
          path: ${{ steps.package.outputs.package-path }}

      - name: Push the version commit and tag it
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          # Tagged here, after the version commit, so the tag and the packaged
          # asset both carry the released version.
          git tag -a "$TAG" -m "CrowFX $TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          HIGHLIGHTS: ${{ inputs.highlights }}
          CHANGELOG_NOTES: ${{ steps.changelog.outputs.notes }}
        shell: bash
        run: |
          NOTES_FILE="$(mktemp)"

          if [ -n "$HIGHLIGHTS" ]; then
            {
              echo "## Highlights"
              echo ""
              printf '%s\n' "$HIGHLIGHTS"
            } > "$NOTES_FILE"
          else
            printf '%s\n' "$CHANGELOG_NOTES" > "$NOTES_FILE"
          fi

          {
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md) for details."
          } >> "$NOTES_FILE"

          echo "Release notes:"
          cat "$NOTES_FILE"

          gh release create "$TAG" \
            --title "CrowFX $TAG" \
            --notes-file "$NOTES_FILE" \
            "${{ steps.package.outputs.package-path }}"
